name: Test shared schedules
on:
  pull_request:
    paths:
      - 'camp-schedule/**'
      - '.github/workflows/test-schedules.yml'
  push:
    branches: [main]
    paths:
      - 'camp-schedule/**'
      - '.github/workflows/test-schedules.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camp-schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: camp-schedule/package-lock.json
      - run: npm ci
      - run: npm test
