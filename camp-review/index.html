<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>训练营周复盘</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --soft: #f8f9fb; --track: #eef0f4;
    --ink: #111827; --ink-2: #374151; --muted: #6b7280; --faint: #9ca3af;
    --line: #e5e7eb; --line-2: #eef0f3;
    --accent: #4f46e5; --accent-soft: #eef0ff;
    --xiaoe: #2F6BFF; --xiaoe-soft: #eaf0ff;
    --bili: #FB7299; --bili-soft: #ffeef3;
    --up: #16A34A; --up-soft: #ecfdf3;
    --down: #DC2626; --down-soft: #fef2f2;
    --flat: #6b7280;
    --warn: #b45309; --warn-bg: #fffbeb; --warn-line: #fde68a;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .05);
  }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }
  html.present { font-size: 21px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    line-height: 1.5; overflow-x: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; }
  [hidden] { display: none !important; }
  .num, .tbl td.num, .tbl th.num { font-variant-numeric: tabular-nums; text-align: right; }

  /* ---------- 顶栏 ---------- */
  .topbar { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .topbar-inner {
    max-width: 1240px; margin: 0 auto; padding: 0 20px; min-height: 58px;
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  }
  .logo { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: .01em; white-space: nowrap; }
  .logo:hover { text-decoration: none; }
  .logo::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px;
    background: linear-gradient(135deg, var(--xiaoe) 0 50%, var(--bili) 50% 100%); vertical-align: 1px;
  }
  .nav { display: flex; gap: 4px; align-self: stretch; }
  .nav a {
    display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .nav a:hover { color: var(--ink); text-decoration: none; }
  .nav a.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .spacer { flex: 1; }
  .user-area { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .userchip { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .user-area a { color: var(--ink-2); }
  .user-area a.active { font-weight: 600; color: var(--ink); }
  .demo-bar {
    background: #fef3c7; color: #92400e; border-bottom: 1px solid var(--warn-line);
    text-align: center; font-size: 13px; padding: 7px 16px;
  }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px; }
  main.refreshing { opacity: .55; transition: opacity .15s; pointer-events: none; }

  /* ---------- 通用组件 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border-radius: 9px; border: 1px solid transparent;
    background: var(--ink); color: #fff; font-size: 14px; line-height: 1.3; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { opacity: .88; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--ink-2); border-color: var(--line); }
  .btn.ghost:hover { background: var(--soft); opacity: 1; }
  .btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
  .btn.danger { background: var(--down-soft); color: var(--down); border-color: #fecaca; }
  .btn.link { background: none; border: none; color: var(--accent); padding: 0; }
  .btn.link:hover { text-decoration: underline; }
  .btn-icon {
    background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px;
    font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .btn-icon:hover:not(:disabled) { background: var(--soft); }
  .btn-icon:disabled { color: var(--faint); cursor: not-allowed; }
  #flash {
    position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 10px;
    font-size: 14px; z-index: 200; display: none; max-width: min(560px, 90vw); line-height: 1.6;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18); white-space: pre-line;
  }
  .loading { text-align: center; color: var(--muted); padding: 80px 0; font-size: 14px; }
  .muted { color: var(--muted); }
  .muted-note { color: var(--muted); font-size: .875rem; padding: 10px 0; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .page-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head h1 { font-size: 22px; font-weight: 700; }
  .page-head .spacer { flex: 1; }
  .card-block {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .seg { display: inline-flex; background: #e9ebef; border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    border: none; background: transparent; padding: 6px 14px; border-radius: 8px;
    font-size: 13.5px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .seg button.active { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ch-xiaoe { --ch: var(--xiaoe); --ch-soft: var(--xiaoe-soft); }
  .ch-bilibili { --ch: var(--bili); --ch-soft: var(--bili-soft); }
  .ch-tag {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
    font-size: .8125rem; font-weight: 600; color: var(--ink-2); background: var(--ch-soft, var(--soft)); white-space: nowrap;
  }
  .ch-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--ch, var(--faint)); display: inline-block; }
  .badge {
    display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 6px;
    font-size: .78rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent;
  }
  .badge.closed { background: #f3f4f6; color: #4b5563; }
  .badge.collecting { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
  .badge.open { background: #eef2ff; color: #4338ca; }
  .warn-box {
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: #78350f;
    border-radius: 12px; padding: 12px 16px; font-size: 13.5px; line-height: 1.7; margin-bottom: 14px;
  }
  .warn-box b { display: block; margin-bottom: 4px; color: var(--warn); }
  .warn-box ul, .err-box ul { padding-left: 18px; }
  .err-box {
    background: var(--down-soft); border: 1px solid #fecaca; color: #7f1d1d;
    border-radius: 12px; padding: 12px 16px; font-size: 13.5px; line-height: 1.7; margin-bottom: 14px;
  }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .875rem; }
  .tbl th {
    text-align: left; font-weight: 600; color: var(--muted); font-size: .78rem;
    padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--soft);
  }
  .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  .tbl tbody tr:hover td { background: #fafbfc; }
  .tbl tfoot td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: none; background: var(--soft); }
  .tbl .wrap { white-space: normal; min-width: 160px; }
  .tbl-note { font-size: .78rem; color: var(--muted); margin-top: 6px; }
  .empty-state {
    text-align: center; padding: 90px 20px; background: var(--card); border: 1px dashed var(--line);
    border-radius: var(--radius);
  }
  .empty-state h2 { font-size: 20px; margin-bottom: 8px; }
  .empty-state p { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
  .note-card {
    max-width: 600px; margin: 60px auto; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 28px; line-height: 1.8; box-shadow: var(--shadow);
  }
  .note-card h2 { font-size: 19px; margin-bottom: 8px; }
  .note-card p { color: var(--ink-2); font-size: 14.5px; }
  .note-card code { background: var(--soft); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  #tip {
    position: fixed; z-index: 150; max-width: min(300px, calc(100vw - 24px));
    background: var(--ink); color: #fff; font-size: 13px; line-height: 1.6;
    padding: 9px 12px; border-radius: 9px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    pointer-events: none; display: none;
  }
  html.present #tip { font-size: 16px; max-width: min(420px, calc(100vw - 24px)); }
  .tip {
    display: inline-flex; align-items: center; justify-content: center; cursor: help;
    width: 1.15rem; height: 1.15rem; border-radius: 50%; font-size: .72rem; font-weight: 700; font-style: normal;
    color: var(--faint); border: 1px solid var(--line); background: #fff; flex: none; line-height: 1;
  }
  .tip:hover, .tip:focus { color: var(--ink-2); border-color: var(--faint); outline: none; }

  /* ---------- 弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(17, 24, 39, .45); z-index: 180;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: #fff; border-radius: 16px; max-width: 480px; width: 100%; padding: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25); max-height: 90vh; overflow: auto;
  }
  .modal h3 { font-size: 18px; margin-bottom: 10px; }
  .modal-body { font-size: 14px; color: var(--ink-2); line-height: 1.8; }
  .modal-body ul { padding-left: 18px; margin-top: 6px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }

  /* ---------- 登录 ---------- */
  .auth-wrap { display: flex; justify-content: center; padding: 50px 0; }
  .auth-card {
    background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 32px 30px;
    width: 100%; max-width: 420px; box-shadow: var(--shadow);
  }
  .auth-brand { font-size: 22px; font-weight: 700; }
  .auth-sub { color: var(--muted); font-size: 14px; margin: 4px 0 22px; }
  .auth-card .seg { width: 100%; margin-bottom: 20px; }
  .auth-card .seg button { flex: 1; }
  .field { display: block; margin-bottom: 14px; }
  .field > span, .field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea, .input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus, .input:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .auth-card .btn { width: 100%; padding: 10px; margin-top: 4px; }
  .auth-hint { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }

  /* ---------- 看板：工具栏 ---------- */
  .dash-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .week-nav { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .week-select { position: relative; display: inline-flex; align-items: center; min-width: 0; }
  .week-select select {
    appearance: none; -webkit-appearance: none; border: 1px solid transparent; background: transparent;
    font-size: 1.375rem; font-weight: 700; color: var(--ink); padding: 4px 30px 4px 10px;
    border-radius: 10px; cursor: pointer; font-family: inherit; max-width: 100%;
  }
  .week-select select:hover { background: #fff; border-color: var(--line); }
  .week-select select:focus { outline: none; border-color: var(--accent); background: #fff; }
  .week-select .caret { position: absolute; right: 10px; pointer-events: none; color: var(--muted); font-size: .8rem; }
  .dash-meta { color: var(--muted); font-size: .875rem; margin: 0 0 18px 2px; }
  .review-guide { background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 22px; }
  .review-guide-head h2 { font-size: 1.05rem; }
  .review-guide-head p { font-size: .83rem; color: var(--muted); margin: 6px 0 16px; line-height: 1.6; }
  .review-guide-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .review-guide-step { min-width: 0; }
  .review-guide-step + .review-guide-step { border-left: 1px solid var(--line); padding-left: 18px; }
  .review-guide-step h3 { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; font-size: .92rem; margin-bottom: 10px; }
  .review-guide-step h3 span { font-size: .7rem; color: #3d6350; background: #eaf0ed; border-radius: 5px; padding: 3px 6px; }
  .review-guide-step h3 small { font-size: .73rem; font-weight: 400; color: var(--muted); }
  .review-guide-step ol { padding-left: 1.25rem; display: grid; gap: 7px; font-size: .82rem; line-height: 1.65; color: var(--ink-2); }
  .review-guide-step li::marker { color: var(--muted); }
  .guide-note { font-size: .75rem; line-height: 1.6; color: var(--muted); margin: 12px 0; }
  .trends { scroll-margin-top: 80px; }
  .present-exit {
    display: none; position: fixed; top: 14px; right: 16px; z-index: 60;
    background: rgba(17, 24, 39, .75); color: #fff; border: none; border-radius: 999px;
    padding: 7px 16px; font-size: 13px; cursor: pointer; opacity: .55;
  }
  .present-exit:hover { opacity: 1; }
  body.present .present-exit { display: block; }
  body.present .topbar, body.present .demo-bar, body.present .no-present { display: none !important; }
  body.present main { max-width: 1680px; padding-top: 22px; }

  /* ---------- 看板：期次面板 ---------- */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--ch, var(--line));
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px 18px; margin-bottom: 22px;
  }
  .panel-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .ph-main { min-width: 0; flex: 1 1 320px; }
  .ph-line1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ph-title { font-size: 1.3rem; font-weight: 700; overflow-wrap: anywhere; }
  .ph-line2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: .875rem; color: var(--ink-2); }
  .ph-volatile { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .ph-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
  .ph-meta { font-size: .78rem; color: var(--muted); }

  /* 核心指标条：一张卡片分四格，细线分隔 */
  .kpis {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .kpi { background: #fff; padding: 16px 18px 15px; position: relative; min-width: 0; }
  .kpi.worst::before, .kpi.best::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; }
  .kpi.worst::before { background: var(--down); }
  .kpi.best::before { background: var(--up); }
  .kpi.worst { background: linear-gradient(180deg, #fff7f7 0%, #fff 55%); }
  .kpi-top { display: flex; align-items: center; gap: 6px; min-height: 1.4rem; }
  .kpi-label { font-size: .875rem; font-weight: 600; color: var(--ink-2); }
  .kpi-flag {
    margin-left: auto; font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  }
  .kpi-flag.down { background: var(--down-soft); color: var(--down); }
  .kpi-flag.up { background: var(--up-soft); color: var(--up); }
  .kpi-val { font-size: 2.6rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; margin-top: 10px; color: var(--ink); }
  .kpi-val .pct { font-size: .5em; font-weight: 600; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
  .kpi-val .na { color: var(--faint); }
  .kpi-frac { font-size: .8125rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi-delta { font-size: .8125rem; margin-top: 10px; color: var(--muted); }
  .kpi-delta b { font-weight: 700; white-space: nowrap; }
  .kpi-delta.up b { color: var(--up); }
  .kpi-delta.down b { color: var(--down); }
  .kpi-delta.flat b { color: var(--flat); }
  .kpi-sub { font-size: .75rem; color: var(--faint); margin-top: 3px; }

  .panel-row { display: grid; gap: 18px; margin-top: 18px; }
  .panel-row.funnel-row { grid-template-columns: minmax(0, 1fr) 17.5rem; }
  .panel-row.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .block { border: 1px solid var(--line-2); border-radius: 12px; padding: 16px 18px; min-width: 0; background: #fff; }
  .block-title {
    font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }

  /* 漏斗 */
  .funnel { display: grid; gap: 4px; }
  .f-row {
    display: grid; grid-template-columns: minmax(84px, 128px) minmax(0, 1fr) 78px 74px;
    align-items: center; gap: 12px; font-size: .875rem;
  }
  .f-head { font-size: .72rem; color: var(--faint); }
  .f-label { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-track { height: 1.25rem; background: var(--track); border-radius: 4px; position: relative; }
  .f-bar { height: 100%; background: var(--ch, var(--ink)); border-radius: 0 4px 4px 0; position: relative; }
  .f-val { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .f-val .u { font-weight: 400; color: var(--muted); font-size: .8em; margin-left: 2px; }
  .f-head .f-val, .f-head .f-rate { font-weight: 400; color: var(--faint); }
  .f-rate { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .f-arrow { color: var(--faint); margin-right: 4px; }
  .f-note { font-size: .75rem; color: var(--muted); margin-top: 10px; }

  /* 成交构成 */
  .deals-total { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
  .dt-num { font-size: 2.3rem; font-weight: 650; line-height: 1; letter-spacing: -.02em; }
  .dt-unit { color: var(--muted); font-size: .875rem; }
  .deals-list { list-style: none; border-top: 1px solid var(--line-2); }
  .deals-list li {
    display: flex; align-items: baseline; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: .875rem;
  }
  .deals-list li span { color: var(--ink-2); flex: 1; }
  .deals-list li b { font-variant-numeric: tabular-nums; }
  .deals-list li em { font-style: normal; color: var(--muted); font-size: .78rem; }
  .deals-pending {
    margin-top: 10px; font-size: .8125rem; color: var(--warn); background: var(--warn-bg);
    border-radius: 8px; padding: 6px 10px;
  }

  /* 自动分析 */
  .insights { list-style: none; display: grid; gap: 10px; }
  .ins { display: flex; gap: 10px; font-size: .9rem; line-height: 1.6; color: var(--ink-2); }
  .ins-ic {
    flex: none; width: 1.35rem; height: 1.35rem; border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; font-size: .75rem; font-weight: 800; margin-top: .1rem;
  }
  .ins.good .ins-ic { background: var(--up-soft); color: var(--up); }
  .ins.bad .ins-ic { background: var(--down-soft); color: var(--down); }
  .ins.warn .ins-ic { background: var(--warn-bg); color: var(--warn); }
  .ins.info .ins-ic { background: #f1f5f9; color: #475569; }
  .ins.bad { color: var(--ink); font-weight: 600; }

  /* 复盘结论 */
  .summary-text { white-space: pre-wrap; font-size: .95rem; line-height: 1.75; overflow-wrap: anywhere; }
  .summary-text.empty { color: var(--faint); }
  .summary-slot .btn { margin-top: 12px; }
  .deal-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .deal-kpi { border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; background: #f8fafc; }
