<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill 市集 · 团队技能共享平台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --ink: #1c2333; --muted: #6b7280;
    --brand: #4f46e5; --brand-soft: #eef0ff; --line: #e5e7eb;
    --ok: #059669; --warn: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
  }
  a { color: var(--brand); text-decoration: none; }
  header {
    background: #fff; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .header-inner {
    max-width: 1080px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--ink); }
  .logo span { color: var(--brand); }
  .header-inner .spacer { flex: 1; }
  .btn {
    display: inline-block; padding: 8px 18px; border-radius: 8px; border: none;
    background: var(--brand); color: #fff; font-size: 14px; cursor: pointer;
  }
  .btn:hover { opacity: .9; }
  .btn.ghost { background: var(--brand-soft); color: var(--brand); }
  .btn.small { padding: 5px 12px; font-size: 13px; }
  .userchip { font-size: 14px; color: var(--muted); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  #flash {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 22px; border-radius: 10px;
    font-size: 14px; z-index: 99; display: none; max-width: 90%;
  }
  /* 列表 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
  .toolbar input[type=search] {
    flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 14px; background: #fff;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    padding: 5px 14px; border-radius: 999px; background: #fff; font-size: 13px;
    border: 1px solid var(--line); cursor: pointer; color: var(--muted);
  }
  .chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; cursor: pointer; transition: box-shadow .15s, transform .15s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { box-shadow: 0 6px 20px rgba(30,40,90,.08); transform: translateY(-2px); }
  .skill-card { min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .skill-card > .card { flex: 1; border: 0; background: transparent; box-shadow: none; transform: none; }
  .skill-card:hover { box-shadow: 0 6px 20px rgba(30,40,90,.08); }
  .skill-card:has(.readme-section[open]) { grid-column: 1 / -1; }
  .card h3 { font-size: 16px; }
  .card .desc {
    font-size: 13px; color: var(--muted); line-height: 1.6; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); align-items: center; }
  .tag { background: var(--brand-soft); color: var(--brand); padding: 2px 9px; border-radius: 6px; font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 70px 0; font-size: 15px; line-height: 2; }
  /* 表单 */
  .panel {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; max-width: 560px; margin: 0 auto;
  }
  .panel.wide { max-width: 720px; }
  .panel h2 { margin-bottom: 18px; font-size: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 9px; font-size: 14px; font-family: inherit; background: #fff;
  }
  .field textarea { min-height: 72px; resize: vertical; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.6; }
  .authswitch { text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .dropzone {
    border: 2px dashed var(--line); border-radius: 12px; padding: 30px;
    text-align: center; color: var(--muted); cursor: pointer; font-size: 14px;
    background: var(--bg); transition: border-color .15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--brand); color: var(--brand); }
  .parse-ok { color: var(--ok); font-size: 13px; margin-top: 8px; }
  /* 详情 */
  .detail-head {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 26px; margin-bottom: 18px;
  }
  .detail-head h1 { font-size: 24px; margin-bottom: 8px; }
  .detail-head .desc { color: var(--muted); line-height: 1.7; margin: 8px 0 14px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .install-guides { margin-top: 16px; }
  .install-guides .ig-title { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .install-guides details {
    border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; background: var(--bg);
  }
  .install-guides summary { padding: 10px 14px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .install-guides .g-body { padding: 2px 14px 12px; font-size: 13.5px; color: var(--muted); line-height: 1.9; }
  .install-guides .g-body code {
    background: #fff; border: 1px solid var(--line); padding: 1px 6px;
    border-radius: 5px; font-size: 12.5px;
  }
  .btn.danger { background: #fee2e2; color: #dc2626; }
  .doc {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 26px; margin-bottom: 18px; line-height: 1.8; font-size: 14.5px;
    overflow-x: auto;
  }
  .doc h1, .doc h2, .doc h3 { margin: 18px 0 8px; }
  .doc p, .doc ul, .doc ol { margin: 8px 0; }
  .doc ul, .doc ol { padding-left: 22px; }
  .doc code { background: var(--bg); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
  .doc pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
  .doc pre code { background: none; color: inherit; }
  .doc table { border-collapse: collapse; }
  .doc td, .doc th { border: 1px solid var(--line); padding: 6px 12px; }
  .readme-section { min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 18px; }
  .readme-section > summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; list-style: none; cursor: pointer; padding: 17px 22px; font-size: 14px; font-weight: 600; }
  .readme-section > summary::-webkit-details-marker { display: none; }
  .readme-section > summary:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; border-radius: 10px; }
  .readme-expand, .readme-collapse { color: var(--brand); font-size: 12px; white-space: nowrap; font-weight: 500; }
  .readme-collapse, .readme-section[open] .readme-expand { display: none; }
  .readme-section[open] .readme-collapse { display: inline; }
  .skill-card > .readme-section { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; margin: 0; }
  .skill-card > .readme-section > summary { padding: 13px 21px; font-size: 13px; }
  .readme-content { min-width: 0; padding: 0 22px 20px; }
  .readme-status, .readme-note { font-size: 13px; color: var(--muted); line-height: 1.8; }
  .readme-note { margin: 10px 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
  .readme-meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .readme-actions { display: flex; gap: 16px; align-items: center; margin-top: 12px; font-size: 13px; }
  .readme-document { padding: 4px 0 0; margin: 0; border: 0; border-radius: 0; overflow-wrap: anywhere; }
  .skill-card .readme-document { max-height: 540px; overflow: auto; overscroll-behavior: contain; }
  .readme-document h1 { font-size: 23px; }
  .readme-document h2 { font-size: 19px; }
  .readme-document h3 { font-size: 16px; }
  .readme-document img { max-width: 100%; height: auto; }
  .readme-document blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--muted); margin: 12px 0; }
  .readme-document a { text-decoration: underline; text-underline-offset: 3px; }
  .readme-document:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
  @media (max-width: 600px) { .readme-content { padding: 0 16px 16px; } .readme-section > summary { padding: 16px; } }
  .vlist { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 26px; }
  .vitem { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: baseline; flex-wrap: wrap; }
  .vitem:last-child { border-bottom: none; }
  .vnum { font-weight: 700; color: var(--brand); min-width: 40px; }
  .vlog { flex: 1; font-size: 14px; min-width: 200px; }
  .vmeta { font-size: 12px; color: var(--muted); }
  .backlink { display: inline-block; margin-bottom: 14px; font-size: 14px; }
  .setup-note {
    max-width: 620px; margin: 60px auto; background: #fff7ed; border: 1px solid #fdba74;
    border-radius: 14px; padding: 26px; line-height: 1.9; font-size: 14.5px;
  }
  .setup-note h2 { margin-bottom: 8px; color: var(--warn); }
  .setup-note code { background: #fff; padding: 1px 6px; border-radius: 5px; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font-family: inherit; }
  button:disabled { opacity: .55; cursor: wait; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 3px solid #a5b4fc; outline-offset: 3px;
  }
  .hero { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 0 28px; }
  .eyebrow { color: var(--brand); font-size: 12px; font-weight: 600; letter-spacing: 1.5px; margin-bottom: 9px; }
  .hero h1 { font-size: 28px; letter-spacing: -.5px; margin-bottom: 10px; }
  .hero p { color: var(--muted); line-height: 1.8; font-size: 14px; }
  .hero .actions { margin: 0; flex-shrink: 0; }
  .source-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 22px; flex-wrap: wrap; }
  .source-tab { border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); font-size: 14px; padding: 0 0 12px; cursor: pointer; }
  .source-tab.active { border-bottom-color: var(--brand); color: var(--brand); font-weight: 600; }
  .source-tab span { font-size: 12px; margin-left: 5px; }
  .list-status { font-size: 12px; color: var(--muted); margin: -3px 0 16px; }
  .card { color: var(--ink); padding: 21px; gap: 12px; min-width: 0; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .source-badge { display: inline-block; border-radius: 5px; padding: 3px 8px; font-size: 11px; font-weight: 500; background: #f1f3f7; color: #526078; }
  .source-badge.external { background: #edf7f3; color: #267056; }
  .trial-status { color: var(--muted); font-size: 11px; }
  .card h3 { font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; }
  .card-heading { display: grid; gap: 4px; }
  .skill-original-name { color: var(--muted); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; font-weight: 400; }
  .skill-original-name code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: inherit; }
  .skill-original-name span { margin-right: 6px; }
  .skill-heading-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .skill-heading-row > div { min-width: 0; }
  .skill-heading-row .skill-original-name { margin: 5px 0 14px; font-size: 13px; }
  .skill-heading-row .text-button { flex-shrink: 0; margin-top: 8px; }
  .title-dialog { max-width: 520px; }
  .title-dialog > .hint { margin: 10px 0 20px; }
  @media (max-width: 600px) { .skill-heading-row { flex-direction: column; gap: 0; } .skill-heading-row .text-button { margin: 0 0 14px; } }
  .card .desc { min-height: 0; flex: none; }
  #installation { scroll-margin-top: 80px; }
  .card-bottom { border-top: 1px solid #f0f1f5; padding-top: 12px; margin-top: auto; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .card-bottom .meta { font-size: 11px; }
  .card-action { color: var(--brand); font-size: 12px; flex-shrink: 0; }
  .role-filter { display: flex; align-items: flex-start; gap: 16px; padding: 16px; margin: 4px 0 18px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .filter-caption { color: var(--muted); font-size: 13px; flex-shrink: 0; padding: 8px 0; }
  .role-filter .chips { margin: 0; }
  .card-roles, .detail-roles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .detail-roles { margin: 15px 0; }
  .role-caption { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .role-tag { color: #59528d; background: #f0eef9; border-radius: 5px; padding: 3px 8px; font-size: 11px; line-height: 1.6; }
  .role-unset { color: var(--muted); font-size: 12px; }
  .text-button { border: 0; background: transparent; color: var(--brand); cursor: pointer; font-size: 12px; padding: 4px 6px; }
  .role-field { border: 0; margin: 0 0 24px; min-width: 0; padding: 0; }
  .role-field legend { font-size: 14px; margin-bottom: 12px; }
  .role-field legend span { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .role-choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .role-choice { display: inline-flex; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; cursor: pointer; }
  .role-choice:has(input:checked) { color: var(--brand); background: var(--brand-soft); border-color: #bcb5f7; }
  .role-choice input { width: 14px; height: 14px; accent-color: var(--brand); margin: 0; }
  .role-field .hint { margin-top: 10px; }
  .roles-dialog { max-width: 600px !important; }
  .roles-dialog .role-field { margin: 20px 0 0; }
  .install-step { display: flex; gap: 12px; align-items: flex-start; }
  .step-number { display: grid; place-items: center; width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; color: var(--brand); background: var(--brand-soft); font-size: 13px; font-weight: 600; }
  .install-step h3 { font-size: 14px; margin: 2px 0 7px; }
  .install-step p { color: var(--muted); font-size: 13px; }
  .install-prompt { background: #f7f8ff; border: 1px solid #e2e5f5; border-radius: 10px; padding: 18px; margin: 16px 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.9; font-size: 13px; }
  .next-step { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
  .discover { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 22px 0 0; margin-top: 22px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .share-intro { max-width: 760px; margin: 12px auto 24px; }
  .share-intro h1 { font-size: 26px; margin-bottom: 10px; }
  .share-intro p { color: var(--muted); font-size: 14px; line-height: 1.8; }
  .share-options { max-width: 760px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .share-option { padding: 26px; border: 1px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); }
  .share-option:hover { border-color: #a5b4fc; }
  .share-option h2 { font-size: 20px; margin: 18px 0 10px; }
  .share-option p { font-size: 14px; line-height: 1.8; color: var(--muted); margin-bottom: 24px; }
  .option-symbol { background: var(--brand-soft); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; font-size: 24px; }
  .form-intro { color: var(--muted); line-height: 1.7; font-size: 14px; margin: -8px 0 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .field input:read-only { background: var(--bg); color: var(--muted); }
  .field input, .field select, .field textarea { color: var(--ink); }
  .field .hint { margin-top: 7px; }
  .section-divider { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  .form-error { color: #b42318; font-size: 13px; line-height: 1.7; margin: 12px 0; }
  .source-preview { border-radius: 9px; background: var(--brand-soft); color: #484391; padding: 12px 14px; margin: 0 0 18px; font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
  .source-preview a { text-decoration: underline; }
  .import-input { display: flex; gap: 10px; }
  .import-input input { min-width: 0; flex: 1; }
  .import-input .btn { flex-shrink: 0; }
  .import-status { color: var(--muted); font-size: 12px; line-height: 1.8; margin: -4px 0 16px; overflow-wrap: anywhere; }
  .import-status:empty { display: none; }
  .imported-preview { background: #f7f8ff; border: 1px solid #dfe3f6; border-radius: 12px; padding: 18px; margin: 0 0 16px; }
  .imported-heading { display: flex; align-items: center; gap: 12px; }
  .imported-heading > div { flex: 1; min-width: 0; }
  .imported-heading strong { display: block; font-size: 16px; overflow-wrap: anywhere; }
  .imported-heading p { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .imported-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: #e8eafe; color: var(--brand); font-size: 22px; flex-shrink: 0; }
  .imported-description { margin: 14px 0 0; font-size: 13px; line-height: 1.8; color: #50576a; overflow-wrap: anywhere; max-height: 9em; overflow-y: auto; white-space: pre-wrap; }
  .form-details { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 22px; }
  .form-details summary { padding: 14px 16px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .form-details summary span { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; }
  .form-details[open] summary { border-bottom: 1px solid var(--line); }
  .details-content { padding: 20px 16px 0; }
  .skill-picker { padding: 16px; background: #f7f8ff; border-radius: 10px; }
  .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; align-items: start; }
  .detail-main { min-width: 0; }
  .detail-panel { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 24px; margin-bottom: 18px; }
  .detail-panel h2 { font-size: 16px; margin-bottom: 15px; }
  .detail-panel p { font-size: 14px; line-height: 1.8; }
  .prose { white-space: pre-wrap; overflow-wrap: anywhere; }
  .detail-head .meta { margin-bottom: 14px; }
  .identity-list { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 12px; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
  .identity-list dt { color: var(--muted); }
  .identity-list dd { min-width: 0; }
  .install-command { padding: 15px; background: #f5f6fb; border: 1px solid #e8eaf3; border-radius: 9px; color: #373957; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; font-size: 12px; margin: 14px 0; }
  .install-methods { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .install-note { font-size: 12px !important; color: var(--muted); margin-top: 12px; }
  .preview-banner { background: #fff8e8; border-bottom: 1px solid #f4dfae; color: #805f1d; font-size: 12px; padding: 9px 20px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .preview-banner button { border: none; background: transparent; color: #805f1d; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .notice { padding: 14px 16px; border: 1px solid #e2e5f5; background: #f7f8ff; border-radius: 10px; font-size: 13px; line-height: 1.8; margin-bottom: 18px; }
  .confirm-dialog { border: 1px solid var(--line); border-radius: 16px; padding: 26px; max-width: 440px; width: calc(100% - 32px); margin: auto; color: var(--ink); }
  .confirm-dialog::backdrop { background: rgba(20, 25, 45, .35); }
  .confirm-dialog h2 { font-size: 18px; margin-bottom: 12px; }
  .confirm-dialog p { font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .confirm-dialog .actions { justify-content: flex-end; margin-top: 22px; }
  @media (max-width: 760px) {
    .hero { align-items: flex-start; flex-direction: column; gap: 18px; }
    .detail-layout { grid-template-columns: 1fr; }
